spring.application.name=demo
spring.datasource.url=jdbc:sqlite:src/main/resources/bolsines.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# API key de Google Maps Platform (Roads API). Se toma de la variable de entorno
# GOOGLE_MAPS_API_KEY para no subirla al repo. Vacía = no se consulta a Google.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}