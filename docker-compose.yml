services:

  agps:
    build:
      context: ./agps
      dockerfile: Dockerfile
    image: pepinillojr/tpi-bolsines:agps
    container_name: bolsines-agps
    ports:
      - "8081:8081"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pepinillojr/tpi-bolsines:backend
    container_name: bolsines-backend
    environment:
      - GPS_BASE_URL=http://agps:8081
      # - SESION_ACTIVA=11111111-1111-1111-1111-111111111112
      - SESION_ACTIVA=11111111-1111-1111-1111-111111111111
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pepinillojr/tpi-bolsines:frontend
    container_name: bolsines-frontend
    environment:
      - SESION_ACTIVA=11111111-1111-1111-1111-111111111111
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
